# Concept-Check: Retrieval (Part VI)
# Covers: structured-vs-semantic split (prose-only embedding), embeddings as the
# content-addressed workload, the seen/content_id cache, cosine + top_k behavior.
# Tracing programs are std-only and compiled by rustc at build time.

# --- Tracing: cosine zero-norm guard + orthogonal ---
[[questions]]
type = "Tracing"
prompt.program = """
fn cosine(a: &[f32], b: &[f32]) -> f32 {
    let dot: f32 = a.iter().zip(b).map(|(x, y)| x * y).sum();
    let na = a.iter().map(|x| x * x).sum::<f32>().sqrt();
    let nb = b.iter().map(|x| x * x).sum::<f32>().sqrt();
    if na == 0.0 || nb == 0.0 { 0.0 } else { dot / (na * nb) }
}

fn main() {
    // A zero query against any vector.
    let hit = cosine(&[0.0, 0.0], &[3.0, 4.0]);
    // Orthogonal vectors.
    let ortho = cosine(&[1.0, 0.0], &[0.0, 5.0]);
    println!("{hit} {ortho}");
}
"""
answer.doesCompile = true
answer.stdout = "0 0"
context = """
Two guards, one output. The first call has a **zero-norm** left side (`[0.0, 0.0]`): the `na == 0.0` branch returns `0.0` *before* any division, which is the guard that keeps a zero vector from producing `NaN`. The second call is **orthogonal** (`[1.0, 0.0]` vs `[0.0, 5.0]`): their dot product is `0.0`, so the cosine is `0.0` even though both norms are non-zero. `f32`'s `Display` prints `0.0` as `0`, so the line is `0 0`. These are the two anchor points of the metric — identical vectors would score `1`, opposite vectors `-1`.
"""
id = "272bd730-3de0-4816-aff2-ddd45e12def2"

# --- Tracing: top_k ranks by descending cosine ---
[[questions]]
type = "Tracing"
prompt.program = """
fn cosine(a: &[f32], b: &[f32]) -> f32 {
    let dot: f32 = a.iter().zip(b).map(|(x, y)| x * y).sum();
    let na = a.iter().map(|x| x * x).sum::<f32>().sqrt();
    let nb = b.iter().map(|x| x * x).sum::<f32>().sqrt();
    if na == 0.0 || nb == 0.0 { 0.0 } else { dot / (na * nb) }
}

fn main() {
    let rows: Vec<(&str, Vec<f32>)> = vec![
        ("a", vec![1.0, 0.0]),
        ("b", vec![-1.0, 0.0]),
        ("c", vec![0.5, 0.5]),
    ];
    let query = [1.0f32, 0.0];
    let mut scored: Vec<(&str, f32)> =
        rows.iter().map(|(id, v)| (*id, cosine(&query, v))).collect();
    scored.sort_by(|x, y| y.1.total_cmp(&x.1));
    scored.truncate(2);
    let ids: Vec<&str> = scored.iter().map(|(id, _)| *id).collect();
    println!("{ids:?}");
}
"""
answer.doesCompile = true
answer.stdout = "[\"a\", \"c\"]"
context = """
This is `top_k(query, 2)` written out. Against query `[1.0, 0.0]`: `a`=`[1.0, 0.0]` scores `1.0` (identical direction), `c`=`[0.5, 0.5]` scores `~0.707` (45 degrees off), and `b`=`[-1.0, 0.0]` scores `-1.0` (opposite). The `sort_by(|x, y| y.1.total_cmp(&x.1))` sorts **descending** (note `y` compared to `x`), so the order is `a, c, b`; `truncate(2)` drops `b`, leaving `["a", "c"]`. Two things to catch: the comparator is descending (highest similarity first), and `total_cmp` is used because `f32` is not `Ord` — `partial_cmp().unwrap()` would risk a panic on a `NaN` score.
"""
id = "90a421ea-efb0-4ac7-8a5c-8ee86817e247"

# --- Tracing: content-addressed cache dedupes across loads ---
[[questions]]
type = "Tracing"
prompt.program = """
use std::collections::HashSet;

fn content_id(text: &str) -> String {
    format!("embed\\u{0}{text}")
}

fn main() {
    let mut seen: HashSet<String> = HashSet::new();
    let loads = [
        vec!["falcon", "starship"],
        vec!["starship", "falcon"],
    ];
    let mut embedded = 0;
    for batch in loads {
        for text in batch {
            if seen.insert(content_id(text)) {
                embedded += 1;
            }
        }
    }
    println!("{embedded}");
}
"""
answer.doesCompile = true
answer.stdout = "2"
context = """
Four texts arrive across two loads, but only **two are distinct** — `falcon` and `starship`, each appearing once per load. `HashSet::insert` returns `true` only when the key is *new*, so `embedded` increments on the first `falcon` and first `starship` and stays put on the two repeats. Result: `2`. This is the content-addressed cache in miniature — the expensive step (here, the increment; in the real `EmbedSink`, an API call) runs once per distinct content, no matter how many loads the content is spread across. Keying on `content_id(text)` rather than the raw text is what lets ids computed this run match ids seeded from disk.
"""
id = "772442a7-c6b0-4012-a132-c386d583752f"

# --- MultipleChoice: what gets embedded, and why not the numbers ---
[[questions]]
type = "MultipleChoice"
prompt.prompt = "`Row::prose()` returns `Some` only for a non-empty `Launch.description` and `None` for `SpaceObject` and `Conjunction`. Why are the numeric entities deliberately kept out of the embedding index?"
prompt.distractors = [
  "Embedding numbers is slower than embedding text, so it is skipped for performance",
  "serde cannot serialize `f64` fields into an embedding request body",
  "The numbers are embedded too, just into a separate index file",
]
answer.answer = "Numbers have exact meaning and are queried by threshold/sort (structured retrieval); embedding them is lossy and answers the wrong question — cosine ranks closeness, not `> cutoff`"
context = """
The retrieval split is the whole point of the arc: numeric and categorical fields (`collision_probability`, `net`, a perigee) are retrieved by exact `filter`/`sort` — a `0.001` vs `0.01` difference is a tenfold, decision-changing gap that a many-dimensional embedding would blur away. Cosine similarity ranks by *closeness*, but "probability above a cutoff" is a *threshold*, and no query vector has "everything over the line" as its nearest neighbors. So `Row::prose()` is the codebase's single point of truth for "what here is meaning-bearing prose" — one field, a launch description — and everything else stays in structured retrieval.
"""
id = "6bdedb1f-8d48-4a8e-9d7e-b6dc5703b2ef"

# --- MultipleChoice: brute force is the right call at this scale ---
[[questions]]
type = "MultipleChoice"
prompt.prompt = "The corpus is a few thousand launch descriptions. Why is a brute-force linear cosine scan (`VectorIndex` = a `Vec` + a sort) the *correct* design here, not a stopgap for a vector database?"
prompt.distractors = [
  "A linear scan is approximate but fast, which is all a demo needs",
  "Vector databases cannot compute cosine similarity, only Euclidean distance",
  "The standard library forbids the dependencies a vector database would require",
]
answer.answer = "At a few thousand vectors a full scan is sub-millisecond and returns *exact* nearest neighbors, while an ANN vector DB adds an operational dependency and approximate results — cost you would pay to make a fast, exact operation slightly faster and less correct"
context = """
A vector database buys approximate-nearest-neighbor speed that matters at millions-to-billions of vectors, and charges an operational dependency, an index to rebuild as data changes, and approximate results. Below roughly a hundred thousand vectors, an in-memory linear scan is simpler, exact, and plenty fast. You add an ANN index when *profiling* — not instinct — shows the scan is the bottleneck. Keeping the retriever behind a small surface (`cosine`, `top_k`) means that swap, if it ever comes, touches one struct and no callers.
"""
id = "ff4e2a3e-bc10-4a71-8bd8-ef3da769b5e3"

# --- ShortAnswer: the empty-input no-op ---
[[questions]]
type = "ShortAnswer"
prompt.prompt = "`VoyageEmbedder::embed` is given an empty slice of texts. What must it return, and how many HTTP requests must it make? (Answer the request count.)"
answer.answer = "0"
answer.alternatives = ["zero", "none", "no requests", "0 requests"]
context = """
An empty batch is a no-op: `embed(&[])` returns `Ok(vec![])` and makes **zero** requests, short-circuiting before it ever builds the POST. This is a real correctness rule, not an optimization — an empty batch must not cost a round trip, and some embedding APIs reject an empty `input` outright. It is also what the `empty_input_makes_no_request` test proves: the embedder points at an unroutable address with no mock mounted, so if `embed` *did* call out, the test would fail instead of returning an empty vector.
"""
id = "849f1461-db24-4b30-aa70-35247b4c7ae7"

# --- ShortAnswer: what makes an in-memory set behave like a cross-run cache ---
[[questions]]
type = "ShortAnswer"
prompt.prompt = "`EmbedSink::with_seen` seeds its in-memory `seen` set from the ids already written to `embeddings.jsonl`. What function computes both those on-disk ids and the ids checked during a run, so they match? Name it."
answer.answer = "content_id"
answer.alternatives = ["content_id(\"embed\", text)", "the content_id function", "content_id()", "content-addressing"]
context = """
`content_id("embed", text)` is the bridge. Because a text's id is a pure function of its content (`sha256(kind ‖ 0x00 ‖ text)`), the id stored on disk last run and the id computed for the same text this run are byte-identical. Seeding `seen` with the on-disk ids therefore makes a plain in-memory `HashSet` behave like a durable, cross-run — even cross-machine — cache: a re-run recognizes all its prose as already embedded and makes zero API calls. The same `content_id` you built for idempotent row writes in Part IV is reused here, with the `"embed"` kind tag keeping embedding ids from ever colliding with row ids.
"""
id = "7b50ea1c-79ad-405d-9f71-cddb60900c8d"
